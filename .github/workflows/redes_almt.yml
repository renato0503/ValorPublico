name: Redes sociais + deputados ALMT (ValorPublico)

# Workflow ENXUTO para o projeto valorpublico-b1e6d: roda apenas a busca social
# (sem login) + comentarios do YouTube dos 24 deputados da ALMT e recalcula as
# metricas. NAO coleta Web/TV/Radio/Impresso e NAO mexe nos 50 vereadores.
#
# O cron roda 1x/dia (06:00 America/Cuiaba) por decisao do dono em 23/11/2026.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"   # 1x/dia, 06:00 (America/Cuiaba)

permissions:
  contents: read
  issues: write

concurrency:
  group: redes-almt-valor
  cancel-in-progress: false

jobs:
  redes:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ github.workspace }}/backend/serviceAccountKey.json
      FIREBASE_PROJECT_ID: valorpublico-b1e6d
      # Desliga tudo que nao e rede social (o coletor do Valor e proposital)
      HABILITAR_WEB: "0"
      HABILITAR_TV: "0"
      HABILITAR_RADIO: "0"
      HABILITAR_IMPRESSO: "0"
      HABILITAR_TWITTER: "0"
      HABILITAR_INSTAGRAM: "0"
      HABILITAR_FACEBOOK: "0"
      HABILITAR_TELEGRAM: "0"
      # Liga busca social + comentarios do YouTube
      HABILITAR_BUSCA_SOCIAL: "1"
      BUSCA_SOCIAL_MAX_CONSULTAS: "120"
      BUSCA_SOCIAL_RODIZIO: "1"
      HABILITAR_YOUTUBE: "1"
      YOUTUBE_COLETAR_TRANSCRICAO: "0"
      YOUTUBE_COLETAR_COMENTARIOS: "1"
      YOUTUBE_MAX_VIDEOS: "2"
      YOUTUBE_MAX_COMENTARIOS: "8"
      LIMITE_ITENS_POR_AGENTE: "12"
      # Motores opcionais (sem chave = DuckDuckGo/ddgs)
      GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
      GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decodificar credencial de servico do Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > backend/serviceAccountKey.json
          test -s backend/serviceAccountKey.json

      - name: Testes da busca social
        working-directory: backend
        run: |
          python tests/teste_busca_social.py
          python tests/teste_imports.py

      - name: Upsert dos 24 deputados da ALMT (merge, sem tocar nos 50 vereadores)
        working-directory: backend
        run: |
          python scripts/seed_firebase.py --apenas-almt

      - name: Busca social + comentarios dos deputados (Mato Grosso)
        working-directory: backend
        run: |
          set +e
          python scripts/run_ingestao.py --cidades "Mato Grosso"
          code=$?
          if [ $code -eq 75 ]; then
            echo "::warning::Cota do Firestore esgotada - repetir no proximo ciclo."
            exit 0
          fi
          exit $code

      - name: Recalcular metricas (inclui redes_sociais)
        working-directory: backend
        run: |
          set +e
          python scripts/atualizar_metricas.py
          code=$?
          if [ $code -eq 75 ]; then
            echo "::warning::Cota do Firestore esgotada - repetir no proximo ciclo."
            exit 0
          fi
          exit $code

      - name: Abrir issue automatica em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: runId
            });
            await github.rest.issues.create({
              owner,
              repo,
              title: `⚠️ Redes sociais ALMT (Valor) falhou (${new Date().toLocaleString("pt-BR", { timeZone: "America/Cuiaba" })})`,
              body:
                "A rotina enxuta de redes sociais + deputados falhou.\n\n" +
                `- **Run:** [#${runId}](${run.html_url})\n` +
                `- **Commit:** \`${run.head_sha.slice(0, 7)}\`\n\n` +
                "Verifique os logs.",
            });
