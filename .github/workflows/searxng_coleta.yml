name: Coleta com SearXNG (busca social + prévias públicas)

# Substitui o Google CSE (encerrado para novos clientes, descontinua em
# 01/01/2027) pelo SearXNG: um container open-source que roda em qualquer
# lugar, sem chave e sem custo. O DuckDuckGo (`ddgs`) fica como reserva.
#
# A Approval do app na Meta/TikTok NAO depende deste workflow: e preciso
# rodar em paralelo com ele.

on:
  schedule:
    # 07:00 America/Cuiaba (10:00 UTC) - uma vez por dia, bem antes da
    # ingestao principal, para o SearXNG estar "quente".
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      agentes:
        description: "IDs separados por virgula (vazio = todos)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: searxng-coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      searxng:
        image: searxng/searxng:2025.5.24-abcdef1
        ports:
          - "8080:8080"
        options: >-
          --health-cmd "wget -qO- http://localhost:8080/ || exit 1"
          --health-interval 20s
          --health-timeout 5s
          --health-retries 6

    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ github.workspace }}/backend/serviceAccountKey.json
      FIREBASE_PROJECT_ID: valorpublico-b1e6d
      # SearXNG local (motor n1) + ddgs como reserva
      SEARXNG_URL: http://localhost:8080
      SEARXNG_MOTORES: google,bing,brave,duckduckgo,startpage
      HABILITAR_BUSCA_SOCIAL: "1"
      BUSCA_SOCIAL_MAX_CONSULTAS: "120"
      BUSCA_SOCIAL_MAX_RESULTADOS: "10"
      BUSCA_SOCIAL_RODIZIO: "1"
      # Previas publicas dos links de redes (N2)
      HABILITAR_PREVIAS: "1"
      PREVIAS_MAX_POR_AGENTE: "10"
      # Navegador (N-0/N-1): ritmo baixo por salvaguarda
      NAVEGADOR_STEALTH: "0"
      NAVEGADOR_CONTA_PROPRIA: "0"
      NAVEGADOR_MAX_PAGINAS_AGENTE_DIA: "30"
      # Somente web + redes; o resto fica com o workflow de ingestao
      HABILITAR_WEB: "1"
      HABILITAR_TV: "0"
      HABILITAR_RADIO: "0"
      HABILITAR_IMPRESSO: "0"
      HABILITAR_YOUTUBE: "1"
      HABILITAR_TWITTER: "0"
      HABILITAR_INSTAGRAM: "0"
      HABILITAR_FACEBOOK: "0"
      HABILITAR_TELEGRAM: "0"
      WEB_ENRIQUECER: "0"
      LIMITE_ITENS_POR_AGENTE: "10"

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decodificar credencial de servico do Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > backend/serviceAccountKey.json
          test -s backend/serviceAccountKey.json

      - name: Instalar o Chromium do Playwright
        working-directory: backend
        run: |
          python -m playwright install --with-deps chromium

      - name: Testes (nucleo, busca social, DSM)
        working-directory: backend
        run: |
          python tests/teste_nucleo.py
          python tests/teste_busca_social.py
          python tests/teste_imports.py

      - name: Smoke do SearXNG
        working-directory: backend
        run: |
          python scripts/testar_searxng.py

      - name: Coleta com SearXNG + previas publicas
        working-directory: backend
        run: |
          set +e
          AGENTES="${{ inputs.agentes }}"
          if [ -n "$AGENTES" ]; then
            python scripts/run_ingestao.py --agentes "$AGENTES"
          else
            python scripts/run_ingestao.py
          fi
          code=$?
          if [ $code -eq 75 ]; then
            echo "::warning::Cota do Firestore esgotada - repetir no proximo ciclo."
            exit 0
          fi
          exit $code

      - name: Recalcular metricas
        working-directory: backend
        run: |
          set +e
          python scripts/atualizar_metricas.py
          code=$?
          if [ $code -eq 75 ]; then
            echo "::warning::Cota do Firestore esgotada - repetir no proximo ciclo."
            exit 0
          fi
          exit $code

      - name: Abrir issue automatica em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            await github.rest.issues.create({
              owner,
              repo,
              title: `⚠️ Coleta SearXNG falhou (${new Date().toLocaleString("pt-BR", { timeZone: "America/Cuiaba" })})`,
              body:
                "A coleta com SearXNG (busca social + previas publicas) falhou.\n\n" +
                `- **Run:** [#${runId}](${context.payload.repository ? "https://github.com/" + owner + "/" + repo + "/actions/runs/" + runId : ""})\n` +
                "Verifique os logs.",
            });
