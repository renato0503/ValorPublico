name: Deploy (Firebase Hosting)

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "Target de hosting"
        required: true
        default: "valorpublico"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Credencial de serviço
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > "$RUNNER_TEMP/firebase-sa.json"
          test -s "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy do Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting:${{ github.event.inputs.alvo }} \
            --project valorpublico-b1e6d \
            --non-interactive
