name: Deploy (Firebase Hosting)

on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "Target de hosting"
        required: true
        default: "valorpublico"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy do Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting:${{ github.event.inputs.alvo }} --project ${{ secrets.FIREBASE_PROJECT_ID }}
