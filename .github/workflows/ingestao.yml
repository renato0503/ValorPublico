name: Ingestão diária (scraping + métricas)

on:
  schedule:
    # 06:30 e 18:30 UTC (03:30 e 15:30 no horário de Cuiabá/MT)
    - cron: "30 6 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ingestao
  cancel-in-progress: false

jobs:
  ingestao:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ github.workspace }}/backend/serviceAccountKey.json
      HABILITAR_TWITTER: "0"
      HABILITAR_INSTAGRAM: "0"
      HABILITAR_FACEBOOK: "0"
      HABILITAR_TELEGRAM: "0"
      HABILITAR_WEB: "1"
      HABILITAR_YOUTUBE: "1"
      HABILITAR_TV: "1"
      HABILITAR_RADIO: "1"
      HABILITAR_IMPRESSO: "1"
      INCLUIR_COMENTARIOS: "0"
      WEB_ENRIQUECER: "0"
      YOUTUBE_MAX_VIDEOS: "3"
      MIDIA_VIDEOS_POR_CANAL: "10"
      LIMITE_ITENS_POR_AGENTE: "15"
      # Canais monitorados — sobrescreva via secrets do repositório
      TV_CANAIS: ${{ secrets.TV_CANAIS || '@tvvilareal,@tvcentroamerica,@TVRondon,@tvcidadeverde' }}
      RADIO_CANAIS: ${{ secrets.RADIO_CANAIS || '@centroamericafm,@cbncba,@bandnewsfmcuiaba' }}
      IMPRESSO_SITES: ${{ secrets.IMPRESSO_SITES || 'https://www.caldeiraopolitico.com.br,https://www.folhamax.com,https://www.olhardireto.com.br,https://g1.globo.com/mato-grosso' }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decodificar credencial de serviço do Firebase
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > backend/serviceAccountKey.json
          test -s backend/serviceAccountKey.json

      - name: Ingestão de clippings
        working-directory: backend
        run: |
          python scripts/run_ingestao.py

      - name: Regenerar métricas (dashboard em tempo real)
        working-directory: backend
        run: |
          python scripts/atualizar_metricas.py

      - name: Análise lexical por escopo (AFC, CHD, grafo, dendrograma)
        continue-on-error: true
        working-directory: backend
        run: |
          python scripts/analise_lexical_escopos.py --n-classes 4 --niveis 8

      - name: Abrir issue automática em caso de falha
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: runId
            });
            const { data: issue } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "bot",
            });
            const jaExiste = issue.data.some((i) =>
              i.title.includes(`Ingestão ${run.head_branch || "principal"} falhou`)
            );
            if (jaExiste) {
              console.log("Issue de falha já aberta; nada a criar.");
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title: `⚠️ Ingestão ${run.head_branch || "principal"} falhou (${new Date().toLocaleString("pt-BR", { timeZone: "America/Cuiaba" })})`,
              body:
                "A rotina de ingestão **falhou** automaticamente. \n\n" +
                "### Detalhes\n" +
                `- **Workflow:** ${run.name}\n` +
                `- **Run:** [#${runId}](${run.html_url})\n` +
                `- **Branch:** ${run.head_branch || "principal"}\n` +
                `- **Commit:** \`${run.head_sha.slice(0, 7)}\`\n\n` +
                "Verifique os logs da execução para corrigir antes do próximo agendamento.",
            });