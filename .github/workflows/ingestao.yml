name: Ingestao diaria (ValorPublico)

on:
  schedule:
    # 06:30 e 18:30 UTC todos os dias (03:30 / 15:30 no horario de Cuiaba, UTC-3)
    - cron: "30 6,18 * * *"
  workflow_dispatch: {}

jobs:
  ingestao:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Preparar credenciais (.env + service account)
        working-directory: backend
        run: |
          echo "FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}" > .env
          echo "HABILITAR_TWITTER=0" >> .env
          echo "HABILITAR_INSTAGRAM=0" >> .env
          echo "HABILITAR_FACEBOOK=0" >> .env
          echo "HABILITAR_WEB=1" >> .env
          echo "HABILITAR_YOUTUBE=0" >> .env
          echo "HABILITAR_TELEGRAM=0" >> .env
          echo "HABILITAR_TV=0" >> .env
          echo "HABILITAR_RADIO=0" >> .env
          echo "HABILITAR_IMPRESSO=0" >> .env
          echo "INCLUIR_COMENTARIOS=0" >> .env
          echo "WEB_ENRIQUECER=0" >> .env
          echo "LIMITE_ITENS_POR_AGENTE=15" >> .env
          # Chave de servico fornecida via segredo (base64)
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}" | base64 --decode > serviceAccountKey.json
          echo "FIREBASE_SERVICE_ACCOUNT=$(pwd)/serviceAccountKey.json" >> .env

      - name: Rodar ingestao Web
        working-directory: backend
        run: python scripts/run_ingestao.py

      - name: Regenerar metricas
        working-directory: backend
        run: python scripts/atualizar_metricas.py

      - name: Upload de logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ingestao
          path: backend/data/logs/